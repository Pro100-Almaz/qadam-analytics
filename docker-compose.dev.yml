  celery-worker:
    container_name: celery_worker_dev
    restart: unless-stopped
    build: .
    <<: *django-env
    environment:
      DEBUG: ${DEBUG:-True}
      DB_NAME: ${DB_NAME:-qadam}
      DB_USER: ${DB_USER:-qadam}
      DB_PASSWORD: ${DB_PASSWORD:-qadam}
      DB_HOST: db
      DB_PORT: 5432
      REDIS_URL: redis://redis:6379/1
      CELERY_BROKER_URL: redis://redis:6379/0
      CELERY_RESULT_BACKEND: redis://redis:6379/0
    command: celery -A core worker -l info --concurrency=1
    depends_on: [db, redis]
    volumes:
      - .:/app
    networks: [db_network]

  redis:
    container_name: redis_dev
    image: redis:7-alpine
    restart: unless-stopped
    ports:
      - "6379:6379"
    volumes:
      - redis_data_dev:/data
    networks: [db_network]

  db:
    container_name: postgres_dev
    image: postgres:14-alpine
    restart: unless-stopped
    environment:
      POSTGRES_DB: ${DB_NAME:-qadam}
      POSTGRES_USER: ${DB_USER:-qadam}
      POSTGRES_PASSWORD: ${DB_PASSWORD:-qadam}
    volumes:
      - postgres_data_dev:/var/lib/postgresql/data
    ports:
      - "5433:5432"
    networks: [db_network]

networks:
  db_network: { driver: bridge }

volumes:
  postgres_data_dev:
  redis_data_dev: