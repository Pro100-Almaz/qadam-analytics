  celery-worker:
    container_name: celery_worker_dev
    restart: unless-stopped
    build: .
    <<: *django-env
    environment:
      DEBUG: ${DEBUG:-True}
      DB_NAME: ${DB_NAME:-qadam}
      DB_USER: ${DB_USER:-qadam}
      DB_PASSWORD: ${DB_PASSWORD:-qadam}
      DB_HOST: db
      DB_PORT: 5432
      REDIS_URL: redis://redis:6379/1
      CELERY_BROKER_URL: redis://redis:6379/0
      CELERY_RESULT_BACKEND: redis://redis:6379/0
      # Container-internal endpoint; the host uses http://localhost:9000.
      S3_ENDPOINT_URL: http://minio:9000
      S3_BUCKET_NAME: ${S3_BUCKET_NAME:-qadam-media}
    command: celery -A core worker -l info --concurrency=1
    depends_on: [db, redis]
    volumes:
      - .:/app
    networks: [db_network]

  minio:
    container_name: minio_dev
    image: minio/minio:RELEASE.2025-04-22T22-12-26Z
    restart: unless-stopped
    command: server /data --console-address ":9001"
    environment:
      MINIO_ROOT_USER: ${MINIO_ROOT_USER:-minioadmin}
      MINIO_ROOT_PASSWORD: ${MINIO_ROOT_PASSWORD:-minioadmin}
    volumes:
      - minio_data_dev:/data
    healthcheck:
      test: ["CMD", "mc", "ready", "local"]
      interval: 5s
      timeout: 5s
      retries: 10
    ports:
      - "9000:9000"   # S3 API — matches S3_ENDPOINT_URL=http://localhost:9000
      - "9001:9001"   # web console — http://localhost:9001
    networks: [db_network]

  minio-init:
    container_name: minio_init_dev
    image: minio/mc:latest
    restart: "no"
    environment:
      MINIO_ROOT_USER: ${MINIO_ROOT_USER:-minioadmin}
      MINIO_ROOT_PASSWORD: ${MINIO_ROOT_PASSWORD:-minioadmin}
      S3_BUCKET_NAME: ${S3_BUCKET_NAME:-qadam-media}
    entrypoint: >
      /bin/sh -c "
      mc alias set local http://minio:9000 $${MINIO_ROOT_USER} $${MINIO_ROOT_PASSWORD} &&
      mc mb --ignore-existing local/$${S3_BUCKET_NAME} &&
      mc anonymous set none local/$${S3_BUCKET_NAME} &&
      echo 'minio bucket ready: '$${S3_BUCKET_NAME}
      "
    depends_on:
      minio:
        condition: service_healthy
    networks: [db_network]

  redis:
    container_name: redis_dev
    image: redis:7-alpine
    restart: unless-stopped
    ports:
      - "6380:6379"
    volumes:
      - redis_data_dev:/data
    networks: [db_network]

  db:
    container_name: postgres_dev
    image: postgres:14-alpine
    restart: unless-stopped
    environment:
      POSTGRES_DB: ${DB_NAME:-qadam}
      POSTGRES_USER: ${DB_USER:-qadam}
      POSTGRES_PASSWORD: ${DB_PASSWORD:-qadam}
    volumes:
      - postgres_data_dev:/var/lib/postgresql/data
    ports:
      - "5433:5432"
    networks: [db_network]

networks:
  db_network: { driver: bridge }

volumes:
  postgres_data_dev:
  redis_data_dev:
  minio_data_dev: