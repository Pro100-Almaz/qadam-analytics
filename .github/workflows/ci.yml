name: CI

# The tenancy design leans on automated checks: `manage.py check` refusing an
# unclassified model or a nullable SCHOOL_PATH, and the isolation tests. Until
# this file existed those degraded to "fails if someone remembers to run
# pytest" — which is the discipline that let 133 API classes accumulate 29
# get_queryset overrides in the first place.

on:
  push:
    branches: [master, main, school_separation]
  pull_request:

jobs:
  test:
    runs-on: ubuntu-latest

    services:
      db:
        image: postgres:14-alpine
        env:
          POSTGRES_DB: qadam_test
          POSTGRES_USER: qadam
          POSTGRES_PASSWORD: qadam
        ports: ['5432:5432']
        options: >-
          --health-cmd pg_isready --health-interval 10s
          --health-timeout 5s --health-retries 5

    env:
      DB_NAME: qadam_test
      DB_USER: qadam
      DB_PASSWORD: qadam
      DB_HOST: localhost
      DB_PORT: '5432'
      SECRET_KEY: ci-secret-key-not-used-anywhere-else
      DEBUG: 'False'
      # Media storage is always S3 — settings raise ImproperlyConfigured without
      # an endpoint — so these must be set for `manage.py check` and `pytest` to
      # import at all. Nothing connects to them: conftest's autouse
      # `in_memory_media_storage` fixture swaps STORAGES['default'] for
      # InMemoryStorage, so no MinIO service container is needed here.
      S3_ENDPOINT_URL: http://localhost:9000
      S3_BUCKET_NAME: qadam-test
      S3_ACCESS_KEY: ci
      S3_SECRET_KEY: ci-secret
      # Matches the settings default while Phase 2-3 land inert. The tenancy
      # tests force 'enforce' per-test with override_settings, so they are
      # strict regardless. This flips to 'enforce' suite-wide in Phase 5, once
      # conftest's autouse scope fixture lands and the existing ~6k lines of
      # tests have a school to run inside.
      SCHOOL_SCOPE_MODE: 'off'

    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-python@v5
        with:
          python-version: '3.13'
          cache: pip
          cache-dependency-path: requirements-dev.txt

      - name: Install system libraries
        # weasyprint links against pango/gobject at import time, and
        # student_report's urls.py imports it — so `manage.py check` needs them.
        run: |
          sudo apt-get update
          sudo apt-get install -y libpango-1.0-0 libpangoft2-1.0-0 libharfbuzz0b

      - name: Install dependencies
        # requirements-dev.txt, not requirements.txt: pytest, pytest-django and
        # factory-boy live there (it starts with `-r requirements.txt`, so this
        # is a superset). Installing the runtime set alone made the Tests step
        # die with `pytest: command not found`.
        run: |
          python -m pip install --upgrade pip
          pip install -r requirements-dev.txt

      - name: System checks (includes the tenancy checks)
        run: python manage.py check

      - name: Import-time queryset lint
        # Runs after `check` so Django is known to boot. Guards the two ways a
        # queryset can be built in a class body — at import, with no request and
        # no school scope. Under 'enforce' that crashes django.setup(); under
        # 'off'/'warn', which is where phases 2-4 live, it silently bakes an
        # UNSCOPED queryset that every school then sees. Neither the tenancy
        # system checks nor the isolation tests catch the second case.
        #
        # The tree's existing sites are baselined; this fails only on new ones,
        # and on baselined sites that were fixed without updating the file.
        run: python -m core.tenancy_lint

      - name: Migrations are complete
        run: python manage.py makemigrations --check --dry-run

      - name: Tests
        run: pytest -q
