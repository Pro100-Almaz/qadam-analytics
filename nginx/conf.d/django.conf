# --- HTTP (80) for ACME challenge + redirect ---
server {
    listen 80;
    server_name api.example.com;  # <-- change to your domain

    # ACME challenge files served from a shared volume
    location /.well-known/acme-challenge/ {
        root /var/www/certbot;
    }

    # Everything else: redirect to HTTPS
    location / {
        return 301 https://$host$request_uri;
    }
}

# --- HTTPS (443) real app ---
server {
    listen 443 ssl http2;
    server_name api.example.com;  # <-- change to your domain

    # Certs written by certbot (mounted read-only)
    ssl_certificate     /etc/letsencrypt/live/api.example.com/fullchain.pem;
    ssl_certificate_key /etc/letsencrypt/live/api.example.com/privkey.pem;

    # (Optional) better defaults if present after first run
    ssl_session_timeout 1d;
    ssl_session_cache shared:SSL:10m;
    ssl_session_tickets off;

    # Serve STATIC from shared volume
    location /static/ { alias /vol/static/; access_log off; expires 30d; }

    # Proxy to Django/Gunicorn
    location / {
        proxy_pass         http://appseed-app:8000;
        proxy_set_header   Host $host;
        proxy_set_header   X-Real-IP $remote_addr;
        proxy_set_header   X-Forwarded-For $proxy_add_x_forwarded_for;
        proxy_set_header   X-Forwarded-Proto $scheme;
        proxy_read_timeout 30s;
    }

    location /healthz { proxy_pass http://appseed-app:8000/healthz; access_log off; }
}
