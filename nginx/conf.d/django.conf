# ── Rate-limiting zones ──────────────────────────────────────────
limit_req_zone $binary_remote_addr zone=login:10m   rate=5r/m;
limit_req_zone $binary_remote_addr zone=api:10m     rate=30r/s;
limit_req_zone $binary_remote_addr zone=general:10m rate=10r/s;

# ── Bot / scanner blocking ──────────────────────────────────────
map $http_user_agent $block_bot {
    default 0;
    ~*(?:sqlmap|nikto|nmap|masscan|zgrab|python-requests|Go-http-client|curl/) 1;
    "" 1;
}

# ── Upstream ─────────────────────────────────────────────────────
upstream django {
    server appseed-app:8000;
}

# ── HTTP → HTTPS redirect + ACME challenge ──────────────────────
server {
    listen 80;
    server_name ${NGINX_SERVER_NAME};

    location /.well-known/acme-challenge/ {
        root /var/www/certbot;
    }

    location / {
        return 301 https://$host$request_uri;
    }
}

# ── HTTPS ────────────────────────────────────────────────────────
server {
    listen 443 ssl http2;
    server_name ${NGINX_SERVER_NAME};

    # ── TLS certificates (Let's Encrypt) ────────────────────────
    ssl_certificate     /etc/letsencrypt/live/${NGINX_SERVER_NAME}/fullchain.pem;
    ssl_certificate_key /etc/letsencrypt/live/${NGINX_SERVER_NAME}/privkey.pem;

    # ── TLS hardening ───────────────────────────────────────────
    ssl_protocols TLSv1.2 TLSv1.3;
    ssl_ciphers ECDHE-ECDSA-AES128-GCM-SHA256:ECDHE-RSA-AES128-GCM-SHA256:ECDHE-ECDSA-AES256-GCM-SHA384:ECDHE-RSA-AES256-GCM-SHA384;
    ssl_prefer_server_ciphers off;
    ssl_session_timeout 1d;
    ssl_session_cache shared:SSL:10m;
    ssl_session_tickets off;

    # ── Security headers (only those Django doesn't set) ───────
    # HSTS, X-Frame-Options, X-Content-Type-Options, Referrer-Policy
    # are handled by Django's SecurityMiddleware — no duplicates.
    add_header Permissions-Policy "camera=(), microphone=(), geolocation=()" always;

    # ── Body / upload limits ────────────────────────────────────
    client_max_body_size 10M;

    # ── Static files ────────────────────────────────────────────
    location /static/ {
        alias /vol/static/;
        access_log off;
        expires 30d;
        add_header Cache-Control "public, immutable";
    }

    # ── Media files ─────────────────────────────────────────────
    location /media/ {
        alias /vol/media/;
        access_log off;
        expires 7d;
        add_header Cache-Control "public";
    }

    # ── Health check (no logging, no auth) ──────────────────────
    location /healthz {
        proxy_pass http://django/healthz;
        include /etc/nginx/proxy_params;
        access_log off;
    }

    # ── Login endpoint: strict rate limit ───────────────────────
    location /api/v1/auth/login/ {
        limit_req zone=login burst=3 nodelay;
        limit_req_status 429;

        proxy_pass http://django;
        include /etc/nginx/proxy_params;
    }

    # ── API: general rate limit ─────────────────────────────────
    location /api/ {
        limit_req zone=api burst=60 nodelay;
        limit_req_status 429;

        proxy_pass http://django;
        include /etc/nginx/proxy_params;
    }

    # ── Django admin ────────────────────────────────────────────
    location /admin/ {
        limit_req zone=login burst=5 nodelay;

        proxy_pass http://django;
        include /etc/nginx/proxy_params;
    }

    # ── Everything else → Django ────────────────────────────────
    location / {
        if ($block_bot) { return 403; }
        limit_req zone=general burst=20 nodelay;
        limit_req_status 429;

        proxy_pass http://django;
        include /etc/nginx/proxy_params;
    }
}
