<style>
    .text-wrap-column {
        max-width: 500px;
        white-space: normal !important;
        word-wrap: break-word;
        overflow-wrap: break-word;
    }
</style>

<div class="modal fade" id="alertModal" tabindex="-1" aria-hidden="true">
    <div class="modal-dialog modal-dialog-centered">
        <div class="modal-content">
            <div class="modal-body text-center py-4">
                <div class="mb-3">
                    <i class="fas fa-exclamation-triangle fa-4x text-danger animate__animated animate__pulse animate__infinite"></i>
                </div>

                <h3 class="modal-title mb-2">Внимание!</h3>
                <div class="text-muted text-wrap-column" style="font-size: 1.1rem;">
                    {{ message|linebreaks }}
                </div>
            </div>

            <div class="modal-footer border-0 justify-content-center pb-4">
                <button type="button" class="btn btn-secondary px-4" data-dismiss="modal">
                    Понятно
                </button>
            </div>

        </div>
    </div>
</div>
