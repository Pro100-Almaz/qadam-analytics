{% extends 'layouts/base-fullscreen.html' %}

{% block content %}
<div class="d-flex align-items-center justify-content-center min-vh-50">
  <div class="container-md mt--7 pb-7">
    <div class="row justify-content-center">
      <div class="col-lg-5 col-md-7">
        <div class="card bg-secondary shadow border-0">
          <div class="card-header bg-transparent pb-5">
            <div class="text-muted text-center mt-2">
              Изменить Пароль?
            </div>
          </div>
          <div class="card-body px-lg-5 py-lg-5">
            <div class="text-center text-muted mb-1">
              {% if error %}
                <p class="text-red">{{ error }}</p>
              {% else %}
                <p>
                  Введите свой Еmail адрес для получения письма с подтверждением о смене пароля
                </p>
              {% endif %}
            </div>

            <form method="POST">
              {% csrf_token %}
              <div class="form-group mb-3">
                <div class="input-group input-group-alternative">
                  <div class="input-group-prepend">
                    <span class="input-group-text"><i class="ni ni-hat-3"></i></span>
                  </div>
                  {{ form.username }}
                </div>
              </div>
              <div class="text-center">
                <button type="submit" class="btn btn-primary my-4">Войти</button>
              </div>
            </form>

          </div>
        </div>
      </div>
    </div>
  </div>
</div>



{% endblock %}
