[pytest]
DJANGO_SETTINGS_MODULE = core.settings
python_files = tests/*.py test_*.py *_tests.py
python_classes = Test*
python_functions = test_*
addopts = -v --tb=short --strict-markers
markers =
    slow: marks tests as slow (deselect with '-m "not slow"')
    integration: marks integration tests
    no_auto_scope: opt out of conftest's autouse _default_scope fixture, so the
        test runs with NO active school scope. For isolation tests that assert
        the fail-closed behaviour, and for tests that enter their own scopes.
