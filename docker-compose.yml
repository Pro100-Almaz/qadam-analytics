services:
  nginx:
    container_name: nginx
    image: nginx:1.27-alpine
    restart: unless-stopped
    ports:
      - "80:80"
      - "443:443"
    volumes:
      - ./nginx/nginx.conf:/etc/nginx/nginx.conf:ro
      - ./nginx/conf.d:/etc/nginx/conf.d/templates:ro
      - ./nginx/proxy_params:/etc/nginx/proxy_params:ro
      - static_vol:/vol/static:ro
      - media_vol:/vol/media:ro
      - certbot_www:/var/www/certbot:ro
      - certbot_conf:/etc/letsencrypt:ro
    environment:
      NGINX_SERVER_NAME: ${NGINX_SERVER_NAME:-dashboard.qadam.edu.kz}
    entrypoint: /bin/sh -c "envsubst '$$NGINX_SERVER_NAME' < /etc/nginx/conf.d/templates/django.conf > /etc/nginx/conf.d/default.conf && nginx -g 'daemon off;'"
    depends_on: [appseed-app]
    networks: [app_network]

  certbot:
    container_name: certbot
    image: certbot/certbot:latest
    volumes:
      - certbot_www:/var/www/certbot
      - certbot_conf:/etc/letsencrypt
    entrypoint: /bin/sh -c "trap exit TERM; while :; do certbot renew --webroot -w /var/www/certbot --quiet; sleep 12h & wait $$!; done"
    depends_on: [nginx]
    networks: [app_network]

  appseed-app:
    container_name: appseed_app
    restart: unless-stopped
    build: .
    env_file: .env
    environment:
      DEBUG: "False"
      DB_NAME: ${DB_NAME:-qadam}
      DB_USER: ${DB_USER:-qadam}
      DB_PASSWORD: ${DB_PASSWORD:-qadam}
      DB_HOST: db
      DB_PORT: 5432
      REDIS_URL: redis://redis:6379/1
      CELERY_BROKER_URL: redis://redis:6379/0
      CELERY_RESULT_BACKEND: redis://redis:6379/0
      SERVICE_ACCOUNT_FILE_INTERNAL: /app/core/credentials/qadam_sheet_access.json
    depends_on:
      db:
        condition: service_healthy
      redis:
        condition: service_started
    expose:
      - "8000"
    volumes:
      - static_vol:/vol/static
      - media_vol:/vol/media
    networks: [app_network]

  celery-worker:
    container_name: celery_worker
    restart: unless-stopped
    build: .
    env_file: .env
    environment:
      DEBUG: "False"
      DB_NAME: ${DB_NAME:-qadam}
      DB_USER: ${DB_USER:-qadam}
      DB_PASSWORD: ${DB_PASSWORD:-qadam}
      DB_HOST: db
      DB_PORT: 5432
      REDIS_URL: redis://redis:6379/1
      CELERY_BROKER_URL: redis://redis:6379/0
      CELERY_RESULT_BACKEND: redis://redis:6379/0
    command: celery -A core worker -l info --concurrency=2
    depends_on:
      db:
        condition: service_healthy
      redis:
        condition: service_started
    volumes:
      - media_vol:/vol/media
    networks: [app_network]

  redis:
    container_name: redis
    image: redis:7-alpine
    restart: unless-stopped
    command: redis-server --maxmemory 128mb --maxmemory-policy allkeys-lru
    volumes:
      - redis_data:/data
    networks: [app_network]

  db:
    container_name: postgres
    image: postgres:14-alpine
    restart: unless-stopped
    environment:
      POSTGRES_DB: ${DB_NAME:-qadam}
      POSTGRES_USER: ${DB_USER:-qadam}
      POSTGRES_PASSWORD: ${DB_PASSWORD:-qadam}
    volumes:
      - postgres_data:/var/lib/postgresql/data
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U ${DB_USER:-qadam}"]
      interval: 10s
      timeout: 5s
      retries: 5
    networks: [app_network]

networks:
  app_network: { driver: bridge }

volumes:
  postgres_data:
  redis_data:
  static_vol:
  media_vol:
  certbot_www:
  certbot_conf:
