services:
  nginx:
    container_name: nginx
    image: nginx:1.27-alpine
    restart: unless-stopped
    ports:
      - "80:80"
      - "443:443"
    volumes:
      - ./nginx/nginx.conf:/etc/nginx/nginx.conf:ro
      - ./nginx/conf.d:/etc/nginx/conf.d/templates:ro
      - ./nginx/proxy_params:/etc/nginx/proxy_params:ro
      - static_vol:/vol/static:ro
      - media_vol:/vol/media:ro
      - certbot_www:/var/www/certbot:ro
      - certbot_conf:/etc/letsencrypt:ro
    environment:
      NGINX_SERVER_NAME: ${NGINX_SERVER_NAME:-api.qadam.edu.kz}
      S3_BUCKET_NAME: ${S3_BUCKET_NAME:-qadam-media}
    entrypoint: /bin/sh -c "envsubst '$$NGINX_SERVER_NAME $$S3_BUCKET_NAME' < /etc/nginx/conf.d/templates/django.conf > /etc/nginx/conf.d/default.conf && nginx -g 'daemon off;'"
    depends_on: [appseed-app, minio]
    networks:
      app_network:
        # Lets the app/worker containers reach MinIO through Nginx using the
        # same public hostname the presigned URLs are signed for, without
        # depending on the host's NAT hairpin.
        aliases:
          - ${NGINX_SERVER_NAME:-api.qadam.edu.kz}

  certbot:
    container_name: certbot
    image: certbot/certbot:v2.11.0
    volumes:
      - certbot_www:/var/www/certbot
      - certbot_conf:/etc/letsencrypt
    entrypoint: /bin/sh -c "trap exit TERM; while :; do certbot renew --webroot -w /var/www/certbot --quiet; sleep 12h & wait $$!; done"
    depends_on: [nginx]
    networks: [app_network]

  appseed-app:
    container_name: appseed_app
    restart: unless-stopped
    build: .
    env_file: .env
    environment:
      DEBUG: "False"
      DB_NAME: ${DB_NAME:-qadam}
      DB_USER: ${DB_USER:-qadam}
      DB_PASSWORD: ${DB_PASSWORD:?DB_PASSWORD is required}
      DB_HOST: db
      DB_PORT: 5432
      REDIS_URL: redis://redis:6379/1
      CELERY_BROKER_URL: redis://redis:6379/0
      CELERY_RESULT_BACKEND: redis://redis:6379/0
      SERVICE_ACCOUNT_FILE_INTERNAL: /app/core/credentials/qadam_sheet_access.json
      S3_ENDPOINT_URL: https://${NGINX_SERVER_NAME:-api.qadam.edu.kz}
      S3_BUCKET_NAME: ${S3_BUCKET_NAME:-qadam-media}
    depends_on:
      db:
        condition: service_healthy
      redis:
        condition: service_started
      minio:
        condition: service_healthy
    expose:
      - "8000"
    volumes:
      - static_vol:/vol/static
      - media_vol:/app/media
    networks: [app_network]

  celery-worker:
    container_name: celery_worker
    restart: unless-stopped
    build: .
    env_file: .env
    environment:
      DEBUG: "False"
      DB_NAME: ${DB_NAME:-qadam}
      DB_USER: ${DB_USER:-qadam}
      DB_PASSWORD: ${DB_PASSWORD:?DB_PASSWORD is required}
      DB_HOST: db
      DB_PORT: 5432
      REDIS_URL: redis://redis:6379/1
      CELERY_BROKER_URL: redis://redis:6379/0
      CELERY_RESULT_BACKEND: redis://redis:6379/0
      S3_ENDPOINT_URL: https://${NGINX_SERVER_NAME:-api.qadam.edu.kz}
      S3_BUCKET_NAME: ${S3_BUCKET_NAME:-qadam-media}
    command: celery -A core worker -l info --concurrency=2
    depends_on:
      db:
        condition: service_healthy
      redis:
        condition: service_started
      minio:
        condition: service_healthy
    volumes:
      - media_vol:/app/media
    networks: [app_network]

  minio:
    container_name: minio
    image: minio/minio:RELEASE.2025-04-22T22-12-26Z
    restart: unless-stopped
    command: server /data --console-address ":9001"
    environment:
      MINIO_ROOT_USER: ${MINIO_ROOT_USER:?MINIO_ROOT_USER is required}
      MINIO_ROOT_PASSWORD: ${MINIO_ROOT_PASSWORD:?MINIO_ROOT_PASSWORD is required}
      # Tells MinIO the public origin it is reached through, so presigned
      # URLs proxied by Nginx validate against the right host.
      MINIO_SERVER_URL: https://${NGINX_SERVER_NAME:-api.qadam.edu.kz}
    volumes:
      - minio_data:/data
    healthcheck:
      test: ["CMD", "mc", "ready", "local"]
      interval: 10s
      timeout: 5s
      retries: 5
    # Deliberately not published: reachable only over app_network and via the
    # Nginx /<bucket>/ proxy. The admin console stays off the internet.
    expose:
      - "9000"
      - "9001"
    networks: [app_network]

  minio-init:
    container_name: minio_init
    image: minio/mc:latest
    restart: "no"
    environment:
      MINIO_ROOT_USER: ${MINIO_ROOT_USER:?MINIO_ROOT_USER is required}
      MINIO_ROOT_PASSWORD: ${MINIO_ROOT_PASSWORD:?MINIO_ROOT_PASSWORD is required}
      S3_BUCKET_NAME: ${S3_BUCKET_NAME:-qadam-media}
    entrypoint: >
      /bin/sh -c "
      mc alias set local http://minio:9000 $${MINIO_ROOT_USER} $${MINIO_ROOT_PASSWORD} &&
      mc mb --ignore-existing local/$${S3_BUCKET_NAME} &&
      mc anonymous set none local/$${S3_BUCKET_NAME} &&
      echo 'minio bucket ready: '$${S3_BUCKET_NAME}
      "
    depends_on:
      minio:
        condition: service_healthy
    networks: [app_network]

  redis:
    container_name: redis
    image: redis:7-alpine
    restart: unless-stopped
    command: redis-server --maxmemory 128mb --maxmemory-policy allkeys-lru
    volumes:
      - redis_data:/data
    networks: [app_network]

  db:
    container_name: postgres
    image: postgres:14-alpine
    restart: unless-stopped
    environment:
      POSTGRES_DB: ${DB_NAME:-qadam}
      POSTGRES_USER: ${DB_USER:-qadam}
      POSTGRES_PASSWORD: ${DB_PASSWORD:?DB_PASSWORD is required}
    volumes:
      - postgres_data:/var/lib/postgresql/data
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U ${DB_USER:-qadam}"]
      interval: 10s
      timeout: 5s
      retries: 5
    networks: [app_network]

networks:
  app_network: { driver: bridge }

volumes:
  postgres_data:
  redis_data:
  minio_data:
  static_vol:
  media_vol:
  certbot_www:
  certbot_conf:
